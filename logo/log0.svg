<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="sakthiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51937" />
      <stop offset="100%" stop-color="#B3001E" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1B3D" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E51937" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Emblem Symbol -->
  <g transform="translate(10, 8)">
    <!-- Speed Wings / Hexagon Shield -->
    <path d="M30 4 L56 16 L56 46 L30 62 L4 46 L4 16 Z" fill="url(#wingGrad)" />
    <path d="M30 8 L51 18 L51 43 L30 57 L9 43 L9 18 Z" fill="#FFFFFF" opacity="0.08" />
    
    <!-- Dynamic 'S' Speed Swoosh -->
    <path d="M18 20 C18 16, 40 12, 42 22 C43 27, 20 28, 20 38 C20 48, 42 46, 42 44" 
          stroke="url(#sakthiGrad)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    
    <!-- Wing Blades -->
    <path d="M58 20 L68 15 L66 22 Z" fill="#E51937" />
    <path d="M60 28 L72 23 L69 30 Z" fill="#E51937" />
    <path d="M58 36 L68 33 L66 38 Z" fill="#E51937" opacity="0.8" />
  </g>

  <!-- Typography -->
  <g transform="translate(92, 16)">
    <!-- Brand Name -->
    <text x="0" y="28" font-family="'Outfit', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#0B1B3D" letter-spacing="1.5">
      SAKTHI<tspan fill="#E51937"> MOTORS</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="46" font-family="'Inter', 'Poppins', sans-serif" font-weight="700" font-size="9.5" fill="#64748B" letter-spacing="3.2">
      BAJAJ DEALERSHIP • THENI
    </text>
    
    <!-- Decorative Line -->
    <rect x="0" y="52" width="220" height="2" fill="#E2E8F0" rx="1"/>
    <rect x="0" y="52" width="45" height="2" fill="#E51937" rx="1"/>
  </g>
</svg>
